services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-neon}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: http://localhost
    restart: unless-stopped

  frontend:
    build: ./brunchie_design
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
