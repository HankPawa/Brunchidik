services:

  usuario-service:
    build: ./usuario-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_PROFILE: ${SPRING_PROFILE:-neon}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    restart: unless-stopped

  menu-service:
    build: ./menu-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      SPRING_PROFILE: ${SPRING_PROFILE:-neon}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

  pedido-service:
    build: ./pedido-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      SPRING_PROFILE: ${SPRING_PROFILE:-neon}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

  reserva-service:
    build: ./reserva-service
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      SPRING_PROFILE: ${SPRING_PROFILE:-neon}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

  contacto-service:
    build: ./contacto-service
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      SPRING_PROFILE: ${SPRING_PROFILE:-neon}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    build: ./brunchie_design
    ports:
      - "80:80"
    depends_on:
      - usuario-service
      - menu-service
      - pedido-service
      - reserva-service
      - contacto-service
    restart: unless-stopped
