<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Montis Plaza Comandas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Misma identidad que la aplicación: el color significa estado, y aquí
         el estado es "esto no arrancó". */
      :root {
        --sala: #eef2f1;
        --mantel: #ffffff;
        --filete: #d7e0dd;
        --tinta: #06211f;
        --tinta-2: #5a6e6b;
        --rio: #0c6b62;
        --brasa: #c62f1a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--sala);
        color: var(--tinta);
        font: 16px/1.5 "Archivo", "Segoe UI", system-ui, sans-serif;
        font-variant-numeric: tabular-nums;
        user-select: none;
      }
      header {
        background: var(--rio);
        color: #fff;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
      }
      main {
        padding: 28px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
      }
      .detalle {
        margin: 0 0 24px;
        border-left: 4px solid var(--brasa);
        background: rgba(198, 47, 26, 0.08);
        padding: 12px 14px;
        color: var(--brasa);
        font-size: 15px;
        font-weight: 600;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      ol {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: paso;
      }
      /* La numeración se queda porque esto sí es una secuencia: pasos a seguir
         en orden hasta que el programa arranque. */
      li {
        counter-increment: paso;
        position: relative;
        margin-bottom: 10px;
        padding-left: 36px;
        user-select: text;
      }
      li::before {
        content: counter(paso);
        position: absolute;
        left: 0;
        top: 1px;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: var(--tinta);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
      }
      code {
        background: var(--mantel);
        border: 1px solid var(--filete);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 14px;
        word-break: break-all;
      }
      footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--filete);
        font-size: 15px;
        color: var(--tinta-2);
      }
    </style>
  </head>
  <body>
    <header>Montis Plaza Comandas</header>
    <main>
      <h1 id="titulo">No se pudo iniciar</h1>
      <p class="detalle" id="detalle"></p>
      <div id="ayuda" hidden>
        <h2>Qué puedes hacer</h2>
        <ol id="consejos"></ol>
      </div>
      <footer>Corrige el problema y vuelve a abrir el programa.</footer>
    </main>

    <script>
      const datos = new URLSearchParams(location.search);
      document.getElementById("titulo").textContent = datos.get("titulo") || "No se pudo iniciar";

      const detalle = datos.get("detalle") || "";
      const cajaDetalle = document.getElementById("detalle");
      if (detalle) cajaDetalle.textContent = detalle;
      else cajaDetalle.hidden = true;

      let consejos = [];
      try {
        consejos = JSON.parse(datos.get("consejos") || "[]");
      } catch {
        // Sin consejos legibles: se muestra solo el detalle.
      }
      if (consejos.length > 0) {
        document.getElementById("ayuda").hidden = false;
        const lista = document.getElementById("consejos");
        for (const consejo of consejos) {
          const item = document.createElement("li");
          // El resaltado lo marca quien escribe el mensaje, con acentos graves.
          // Adivinar rutas y comandos por su forma cortaba las rutas con
          // espacios por la mitad, y eso se ve peor que no resaltar nada.
          const partes = consejo.split(/(`[^`]+`)/g);
          for (const parte of partes) {
            if (!parte) continue;
            const esCodigo = /^`.*`$/.test(parte);
            if (esCodigo) {
              const code = document.createElement("code");
              code.textContent = parte.replace(/^`|`$/g, "");
              item.appendChild(code);
            } else {
              item.appendChild(document.createTextNode(parte));
            }
          }
          lista.appendChild(item);
        }
      }
    </script>
  </body>
</html>
