name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  usuario-service:
    name: Build usuario-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        working-directory: usuario-service
        run: mvn package -DskipTests -B

  menu-service:
    name: Build menu-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        working-directory: menu-service
        run: mvn package -DskipTests -B

  pedido-service:
    name: Build pedido-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        working-directory: pedido-service
        run: mvn package -DskipTests -B

  reserva-service:
    name: Build reserva-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        working-directory: reserva-service
        run: mvn package -DskipTests -B

  contacto-service:
    name: Build contacto-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        working-directory: contacto-service
        run: mvn package -DskipTests -B

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: brunchie_design/package-lock.json
      - name: Install dependencies
        working-directory: brunchie_design
        run: npm ci
      - name: Build
        working-directory: brunchie_design
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
