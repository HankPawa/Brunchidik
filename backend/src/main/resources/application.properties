# =============================================
#   Cambia el perfil activo según donde trabajes
#
#   local → pgAdmin (PostgreSQL local)
#   neon  → Neon (PostgreSQL en la nube)
# =============================================
spring.profiles.active=${SPRING_PROFILE:local}

# Servidor
server.port=${PORT:8080}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
